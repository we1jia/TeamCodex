<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img"><title>TeamCodex 系统架构与上下文接力</title><defs><marker id="2865c7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2865c7"/></marker><marker id="c65323" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c65323"/></marker><marker id="7560a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7560a6"/></marker><marker id="52647a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52647a"/></marker></defs><g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Segoe UI, sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f6f8fc" stroke="#f6f8fc" stroke-width="2"/><text x="60" y="60" font-size="20" fill="#2865c7" font-weight="700" text-anchor="start">TEAMCODEX  /  ARCHITECTURE</text><text x="60" y="121" font-size="43" fill="#172b42" font-weight="700" text-anchor="start">独立的 AI 会话，共同的团队上下文</text><text x="60" y="168" font-size="25" fill="#52647a" font-weight="400" text-anchor="start">通过同一个 Hub 分享、同步和接力；每位成员保留自己的桌面会话。</text><rect x="60" y="230" width="360" height="430" rx="22" fill="#ffffff" stroke="#d4dfeb" stroke-width="2"/><text x="86" y="276" font-size="28" fill="#172b42" font-weight="650" text-anchor="start">成员 A</text><text x="86" y="309" font-size="21" fill="#52647a" font-weight="400" text-anchor="start">macOS / Windows</text><rect x="82" y="337" width="316" height="174" rx="14" fill="#eef5ff" stroke="#c9daf5" stroke-width="2"/><text x="100" y="376" font-size="25" fill="#172b42" font-weight="600" text-anchor="start">Codex / ChatGPT</text><text x="100" y="423" font-size="29" fill="#2865c7" font-weight="650" text-anchor="start">Team 工作区</text><text x="100" y="466" font-size="23" fill="#52647a" font-weight="400" text-anchor="start">分享快照 · 讨论 · 导入</text><polyline points="240,555 240,516" fill="none" stroke="#52647a" stroke-width="3" stroke-linejoin="round" marker-end="url(#52647a)"/><text x="259" y="542" font-size="18" fill="#52647a" font-weight="400" text-anchor="start">CDP</text><text x="86" y="591" font-size="25" fill="#172b42" font-weight="600" text-anchor="start">本机伴侣 + 注入器</text><text x="86" y="627" font-size="22" fill="#52647a" font-weight="400" text-anchor="start">启动 / 挂载桌面端工作区</text><rect x="1180" y="230" width="360" height="430" rx="22" fill="#ffffff" stroke="#d4dfeb" stroke-width="2"/><text x="1206" y="276" font-size="28" fill="#172b42" font-weight="650" text-anchor="start">成员 B / 更多成员</text><text x="1206" y="309" font-size="21" fill="#52647a" font-weight="400" text-anchor="start">macOS / Windows</text><rect x="1202" y="337" width="316" height="174" rx="14" fill="#eef5ff" stroke="#c9daf5" stroke-width="2"/><text x="1220" y="376" font-size="25" fill="#172b42" font-weight="600" text-anchor="start">Codex / ChatGPT</text><text x="1220" y="423" font-size="29" fill="#2865c7" font-weight="650" text-anchor="start">Team 工作区</text><text x="1220" y="466" font-size="23" fill="#52647a" font-weight="400" text-anchor="start">分享快照 · 讨论 · 导入</text><polyline points="1360,555 1360,516" fill="none" stroke="#52647a" stroke-width="3" stroke-linejoin="round" marker-end="url(#52647a)"/><text x="1379" y="542" font-size="18" fill="#52647a" font-weight="400" text-anchor="start">CDP</text><text x="1206" y="591" font-size="25" fill="#172b42" font-weight="600" text-anchor="start">本机伴侣 + 注入器</text><text x="1206" y="627" font-size="22" fill="#52647a" font-weight="400" text-anchor="start">启动 / 挂载桌面端工作区</text><rect x="620" y="230" width="360" height="430" rx="22" fill="#fff7ef" stroke="#eab78d" stroke-width="2"/><text x="649" y="279" font-size="32" fill="#172b42" font-weight="700" text-anchor="start">TeamCodex Hub</text><text x="649" y="316" font-size="23" fill="#c65323" font-weight="400" text-anchor="start">Node.js · :18765</text><text x="649" y="370" font-size="27" fill="#172b42" font-weight="650" text-anchor="start">房间与访问控制</text><text x="649" y="406" font-size="20" fill="#52647a" font-weight="400" text-anchor="start">房间口令 · 成员权限</text><text x="649" y="473" font-size="27" fill="#172b42" font-weight="650" text-anchor="start">实时协作</text><text x="649" y="509" font-size="20" fill="#52647a" font-weight="400" text-anchor="start">消息 · 快照 · 在线状态</text><text x="649" y="576" font-size="27" fill="#172b42" font-weight="650" text-anchor="start">团队工作区</text><text x="649" y="612" font-size="20" fill="#52647a" font-weight="400" text-anchor="start">看板 · 知识库 · 素材 · 日历</text><text x="520" y="334" font-size="22" fill="#2865c7" font-weight="600" text-anchor="middle">请求 / 分享</text><text x="520" y="359" font-size="18" fill="#52647a" font-weight="400" text-anchor="middle">HTTP API</text><polyline points="429,377 611,377" fill="none" stroke="#2865c7" stroke-width="3" stroke-linejoin="round" marker-end="url(#2865c7)"/><text x="520" y="432" font-size="22" fill="#c65323" font-weight="600" text-anchor="middle">实时更新</text><text x="520" y="458" font-size="18" fill="#52647a" font-weight="400" text-anchor="middle">SSE</text><polyline points="611,476 429,476" fill="none" stroke="#c65323" stroke-width="3" stroke-linejoin="round" marker-end="url(#c65323)"/><text x="1080" y="334" font-size="22" fill="#2865c7" font-weight="600" text-anchor="middle">请求 / 分享</text><text x="1080" y="359" font-size="18" fill="#52647a" font-weight="400" text-anchor="middle">HTTP API</text><polyline points="1171,377 989,377" fill="none" stroke="#2865c7" stroke-width="3" stroke-linejoin="round" marker-end="url(#2865c7)"/><text x="1080" y="432" font-size="22" fill="#c65323" font-weight="600" text-anchor="middle">实时更新</text><text x="1080" y="458" font-size="18" fill="#52647a" font-weight="400" text-anchor="middle">SSE</text><polyline points="989,476 1171,476" fill="none" stroke="#c65323" stroke-width="3" stroke-linejoin="round" marker-end="url(#c65323)"/><polyline points="520,826 557,826 557,618 613,618" fill="none" stroke="#7560a6" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#7560a6)"/><polyline points="800,666 800,743" fill="none" stroke="#52647a" stroke-width="3" stroke-linejoin="round" marker-end="url(#52647a)"/><text x="824" y="711" font-size="21" fill="#52647a" font-weight="400" text-anchor="start">读写</text><rect x="60" y="750" width="460" height="180" rx="22" fill="#f3effa" stroke="#d9cfea" stroke-width="2"/><text x="86" y="793" font-size="26" fill="#7560a6" font-weight="650" text-anchor="start">Codex 插件 · Skills / Hook</text><text x="86" y="834" font-size="24" fill="#172b42" font-weight="400" text-anchor="start">读取 Hub 摘要 → 当前 AI 会话</text><text x="86" y="872" font-size="22" fill="#52647a" font-weight="400" text-anchor="start">GET /api/compact.txt</text><text x="86" y="909" font-size="21" fill="#52647a" font-weight="400" text-anchor="start">可选入口；侧栏挂载仍由 CDP 完成</text><rect x="610" y="750" width="460" height="180" rx="22" fill="#ffffff" stroke="#d4dfeb" stroke-width="2"/><text x="637" y="793" font-size="27" fill="#172b42" font-weight="650" text-anchor="start">Hub 所在机器的持久化存储</text><text x="637" y="834" font-size="22" fill="#52647a" font-weight="400" text-anchor="start">messages.json · workspace.json</text><text x="637" y="872" font-size="22" fill="#52647a" font-weight="400" text-anchor="start">uploads/ · workspace-blobs/</text><text x="637" y="909" font-size="21" fill="#52647a" font-weight="400" text-anchor="start">消息 / 快照 / 工作区数据 / 文件</text><text x="1140" y="783" font-size="27" fill="#172b42" font-weight="650" text-anchor="start">一次上下文接力</text><text x="1140" y="830" font-size="24" fill="#2865c7" font-weight="400" text-anchor="start">01  A 分享所选会话</text><text x="1140" y="871" font-size="24" fill="#c65323" font-weight="400" text-anchor="start">02  Hub 保存并推送</text><text x="1140" y="912" font-size="24" fill="#2865c7" font-weight="400" text-anchor="start">03  B 选择并导入</text><rect x="60" y="983" width="1480" height="81" rx="16" fill="#eaf0f7" stroke="#eaf0f7" stroke-width="2"/><text x="87" y="1033" font-size="25" fill="#172b42" font-weight="600" text-anchor="start">同一套架构，三种 Hub 部署位置</text><text x="680" y="1033" font-size="23" fill="#52647a" font-weight="400" text-anchor="start">本机 / 虚拟机</text><text x="966" y="1033" font-size="23" fill="#52647a" font-weight="400" text-anchor="start">团队局域网</text><text x="1234" y="1033" font-size="23" fill="#52647a" font-weight="400" text-anchor="start">私有云 / VPS</text></g></svg>