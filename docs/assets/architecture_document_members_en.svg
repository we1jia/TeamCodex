<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#909aab"/></marker></defs><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.4" /><text x="60" y="63" fill="#315a85" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18" font-weight="500">TEAMCODEX</text><text x="1180" y="63" fill="#647184" font-family="Menlo, monospace" font-size="17" font-weight="400">MEMBER RELATIONSHIPS</text><text x="60" y="121" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="35" font-weight="500">Separate Sessions, Shared Room, Two-Way Collaboration</text><text x="60" y="169" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="20" font-weight="400">Members exchange shared content through a common Hub; each person decides what to import into their own AI session.</text><rect x="60" y="234" width="370" height="500" rx="8" fill="#eef2f6" stroke="none" stroke-width="1.4" /><text x="84" y="278" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="28" font-weight="500">Member A</text><text x="84" y="314" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="19" font-weight="400">Personal Device · macOS / Windows</text><rect x="82" y="340" width="326" height="144" rx="6" fill="#ffffff" stroke="#cbd2dc" stroke-width="1.4" /><text x="104" y="377" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="24" font-weight="500">Codex / ChatGPT</text><text x="104" y="415" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="21" font-weight="400">A&#x27;s Isolated AI Session</text><text x="104" y="453" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="17" font-weight="400">Unshared