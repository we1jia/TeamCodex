C, sans-serif" font-size="17" font-weight="400">Unshared chats remain strictly local</text><polyline points="1286,489 1286,543" fill="none" stroke="#909aab" stroke-width="1.8" marker-end="url(#gray)"/><text x="1190" y="522" fill="#315a85" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18" font-weight="400">Share</text><polyline points="1422,548 1422,494" fill="none" stroke="#909aab" stroke-width="1.8" marker-end="url(#gray)"/><text x="1434" y="522" fill="#315a85" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18" font-weight="400">Import</text><rect x="1192" y="553" width="326" height="118" rx="6" fill="#ffffff" stroke="#cbd2dc" stroke-width="1.4" /><text x="1214" y="591" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="24" font-weight="500">Team Workspace</text><text x="1214" y="632" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="20" font-weight="400">Receive updates · Discuss · Import</text><text x="1194" y="709" fill="#315a85" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18" font-weight="400">Companion App → Mounts via CDP</text><rect x="620" y="234" width="360" height="500" rx="8" fill="#eef2f6" stroke="none" stroke-width="1.4" /><text x="644" y="278" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="28" font-weight="500">TeamCodex Hub</text><text x="644" y="314" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="20" font-weight="400">Node.js · 18765</text><rect x="642" y="340" width="316" height="331" rx="6" fill="#ffffff" stroke="#aabed1" stroke-width="1.4" /><text x="665" y="380" fill="#315a85" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="25" font-weight="500">Same Team Room</text><text x="665" y="418" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="20" font-weight="400">Room Key / Member Access</text><polyline points="665,444 936,444" fill="none" stroke="#d4dce5" stroke-width="1.8" /><text x="665" y="482" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="21" font-weight="400">Shared messages &amp; snapshots</text><text x="665" y="520" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="21" font-weight="400">Member presence &amp; status</text><text x="665" y="558" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="21" font-weight="400">Task board / Knowledge base</text><text x="665" y="596" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="21" font-weight="400">Asset library / Calendar</text><text x="665" y="641" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18" font-weight="400">More members connect identically</text><text x="644" y="709" fill="#315a85" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="19" font-weight="400">Shared in room by permissions</text><polyline points="430,568 612,568" fill="none" stroke="#909aab" stroke-width="1.8" marker-end="url(#gray)"/><text x="446" y="551" fill="#315a85" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="19" font-weight="400">HTTP Request</text><polyline points="620,640 438,640" fill="none" stroke="#909aab" stroke-width="1.8" marker-end="url(#gray)"/><text x="453" y="624" fill="#315a85" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="19" font-weight="400">SSE Update</text><polyline points="1170,568 988,568" fill="none" stroke="#909aab" stroke-width="1.8" marker-end="url(#gray)"/><text x="996" y="551" fill="#315a85" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="19" font-weight="400">HTTP Request</text><polyline points="980,640 1162,640" fill="none" stroke="#909aab" stroke-width="1.8" marker-end="url(#gray)"/><text x="1003" y="624" fill="#315a85" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="19" font-weight="400">SSE Update</text><rect x="60" y="782" width="490" height="129" rx="6" fill="#eef2f6" stroke="none" stroke-width="1.4" /><text x="84" y="819" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="23" font-weight="500">Every Member Can Share &amp; Import</text><text x="84" y="860" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="16" font-weight="400">A and B are peer collaborators, not fixed senders and receivers.</text><text x="84" y="890" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="17" font-weight="400">Members collaborate via Hub; local sessions never merge directly.</text><polyline points="800,736 800,775" fill="none" stroke="#909aab" stroke-width="1.8" marker-end="url(#gray)"/><rect x="580" y="782" width="460" height="129" rx="6" fill="#ffffff" stroke="#cbd2dc" stroke-width="1.4" /><text x="604" y="819" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="23" font-weight="500">Hub Persistent Storage</text><text x="604" y="860" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18" font-weight="400">Messages / snapshots / workspace data / files</text><text x="604" y="890" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18" font-weight="400">Deploy locally, on LAN, or on private cloud</text><rect x="1070" y="782" width="470" height="129" rx="6" fill="#eef2f6" stroke="none" stroke-width="1.4" /><text x="1094" y="819" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="23" font-weight="500">Optional: Codex Plugin Entry</text><text x="1094" y="860" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18" font-weight="400">Skills / Hook read Hub summaries</text><text x="1094" y="890" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="17" font-weight="400">Inject summary into task; separate from sidebar</text><polyline points="60,953 1540,953" fill="none" stroke="#cbd2dc" stroke-width="1.8" /><text x="60" y="997" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="24" font-weight="500">Example · A Shares, B Takes Over</text><text x="60" y="1041" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="21" font-weight="400">A selects &amp; shares chat   →   Hub stores &amp; notifies room   →   B inspects in Team   →   B selects &amp; imports into local chat</text><text x="60" y="1084" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18" font-weight="400">Scope: Explicitly shared content only. Real-time push does not auto-inject into every member&#x27;s AI session.</text></svg>