rif" font-size="20" font-weight="400">素材 · 工作日历</text><rect x="584" y="610" width="492" height="79" rx="8" fill="#ffffff" stroke="#d7d8d5" stroke-width="1.4" /><text x="604" y="642" fill="#bb622d" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="23" font-weight="500">SSE 事件推送</text><text x="604" y="673" fill="#737575" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="20" font-weight="400">向同房间客户端分发更新</text><rect x="1240" y="332" width="300" height="286" rx="10" fill="#fff" stroke="#d7d8d5" stroke-width="1.4" /><g transform="translate(1265 355)" fill="none" stroke="#737575" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="18" cy="5" rx="17" ry="5"/><path d="M1 5v22c0 7 34 7 34 0V5M1 16c0 7 34 7 34 0"/></g><text x="1318" y="380" fill="#252627" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="23" font-weight="500">Hub 本地存储</text><polyline points="1265,406 1515,406" fill="none" stroke="#e2e2dc" stroke-width="1.8" /><text x="1265" y="444" fill="#252627" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="21" font-weight="400">消息 / 会话快照</text><text x="1265" y="474" fill="#737575" font-family="Menlo, monospace" font-size="17" font-weight="400">messages.json</text><text x="1265" y="516" fill="#252627" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="21" font-weight="400">工作区 / 上传文件</text><text x="1265" y="546" fill="#737575" font-family="Menlo, monospace" font-size="17" font-weight="400">workspace.json</text><text x="1265" y="579" fill="#737575" font-family="Menlo, monospace" font-size="17" font-weight="400">uploads/ · blobs</text><polyline points="1100,447 1232,447" fill="none" stroke="#737575" stroke-width="1.8" marker-end="url(#gray)"/><text x="1132" y="432" fill="#737575" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="20" font-weight="400">保存</text><polyline points="1240,540 1108,540" fill="none" stroke="#737575" stroke-width="1.8" marker-end="url(#gray)"/><text x="1132" y="525" fill="#737575" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="20" font-weight="400">读取</text><polyline points="400,326 552,326" fill="none" stroke="#737575" stroke-width="1.8" marker-end="url(#gray)"/><text x="422" y="311" fill="#737575" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18" font-weight="400">HTTP 请求</text><polyline points="560,402 408,402" fill="none" stroke="#bb622d" stroke-width="1.8" marker-end="url(#orange)"/><text x="428" y="387" fill="#bb622d" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18" font-weight="400">SSE 更新</text><polyline points="400,550 552,550" fill="none" stroke="#737575" stroke-width="1.8" marker-end="url(#gray)"/><text x="422" y="535" fill="#737575" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18" font-weight="400">HTTP 请求</text><polyline points="560,626 408,626" fill="none" stroke="#bb622d" stroke-width="1.8" marker-end="url(#orange)"/><text x="428" y="611" fill="#bb622d" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18" font-weight="400">SSE 更新</text><text x="60" y="764" fill="#737575" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="20" font-weight="400">接入与部署</text><polyline points="196,757 1540,757" fill="none" stroke="#deded7" stroke-width="1.8" /><rect x="60" y="787" width="460" height="151" rx="10" fill="#fff" stroke="#d7d8d5" stroke-width="1.4" /><text x="84" y="824" fill="#252627" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="23" font-weight="500">本机挂载</text><text x="84" y="860" fill="#252627" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="21" font-weight="400">伴侣程序 → CDP → Team 工作区</text><text x="84" y="899" fill="#737575" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="19" font-weight="400">CDP 负责本机 UI 挂载，不承担跨机同步。</text><rect x="540" y="787" width="500" height="151" rx="10" fill="#fff" stroke="#d7d8d5" stroke-width="1.4" /><text x="564" y="824" fill="#252627" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="23" font-weight="500">Codex 插件入口</text><text x="564" y="860" fill="#252627" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="21" font-weight="400">Skills / Hook → Hub 摘要 → 当前任务</text><text x="564" y="899" fill="#737575" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="19" font-weight="400">可选上下文入口，与可见侧栏分开。</text><rect x="1060" y="787" width="480" height="151" rx="10" fill="#fff" stroke="#d7d8d5" stroke-width="1.4" /><text x="1084" y="824" fill="#252627" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="23" font-weight="500">同一套 Hub，三种部署位置</text><text x="1084" y="860" fill="#252627" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="21" font-weight="400">本机 / 虚拟机 · 团队局域网 · 私有云</text><text x="1084" y="899" fill="#737575" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="19" font-weight="400">客户端连接同一中枢，无需合并各自会话。</text><polyline points="60,982 1540,982" fill="none" stroke="#d7d8d5" stroke-width="1.8" /><text x="60" y="1031" fill="#252627" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="23" font-weight="500">一次上下文接力</text><text x="350" y="1031" fill="#252627" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="23" font-weight="400">1  分享所选会话</text><polyline points="552,1024 629,1024" fill="none" stroke="#737575" stroke-width="1.8" marker-end="url(#gray)"/><text x="657" y="1031" fill="#252627" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="23" font-weight="400">2  Hub 保存并推送</text><polyline points="894,1024 972,1024" fill="none" stroke="#737575" stroke-width="1.8" marker-end="url(#gray)"/><text x="1000" y="1031" fill="#252627" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="23" font-weight="400">3  成员选择并导入</text><text x="60" y="1080" fill="#737575" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18" font-weight="400">推送更新 ≠ 自动导入全部团队对话</text></svg>