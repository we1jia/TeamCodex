<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><title>TeamCodex 组件架构与协作数据流</title><defs><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#737575"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#bb622d"/></marker></defs><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#fbfbf8" stroke="none" stroke-width="1.4" /><text x="60" y="62" fill="#bb622d" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="19" font-weight="500">TEAMCODEX</text><text x="1210" y="62" fill="#737575" font-family="Menlo, monospace" font-size="17" font-weight="400">SYSTEM OVERVIEW / 01</text><text x="60" y="120" fill="#252627" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="34" font-weight="500">团队上下文，如何在独立会话之间流转</text><text x="60" y="162" fill="#737575" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="22" font-weight="400">桌面端保持独立；共享内容经由同一个 Hub 保存、推送，再由成员选择导入。</text><polyline points="60,190 1540,190" fill="none" stroke="#d7d8d5" stroke-width="1.8" /><text x="60" y="232" fill="#252627" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="22" font-weight="500">01   桌面客户端</text><text x="560" y="232" fill="#252627" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="22" font-weight="500">02   协作中枢</text><text x="1240" y="232" fill="#252627" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="22" font-weight="500">03   数据存储</text><rect x="60" y="262" width="340" height="185" rx="10" fill="#fff" stroke="#d7d8d5" stroke-width="1.4" /><g transform="translate(84 287)" fill="none" stroke="#737575" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="34" height="24" rx="3"/><path d="M17 24v8M7 32h20"/></g><text x="137" y="309" fill="#252627" font-family="He