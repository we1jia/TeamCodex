 Neue, PingFang SC, sans-serif" font-size="18" font-weight="400">分享</text><polyline points="1422,548 1422,494" fill="none" stroke="#909aab" stroke-width="1.8" marker-end="url(#gray)"/><text x="1438" y="522" fill="#315a85" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="18" font-weight="400">导入</text><rect x="1192" y="553" width="326" height="118" rx="6" fill="#ffffff" stroke="#cbd2dc" stroke-width="1.4" /><text x="1214" y="591" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="24" font-weight="500">Team 工作区</text><text x="1214" y="632" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="21" font-weight="400">接收更新 · 讨论 · 选择导入</text><text x="1194" y="709" fill="#315a85" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="20" font-weight="400">本机伴侣 → CDP 挂载工作区</text><rect x="620" y="234" width="360" height="500" rx="8" fill="#eef2f6" stroke="none" stroke-width="1.4" /><text x="644" y="278" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="28" font-weight="500">TeamCodex Hub</text><text x="644" y="314" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="20" font-weight="400">Node.js · 18765</text><rect x="642" y="340" width="316" height="331" rx="6" fill="#ffffff" stroke="#aabed1" stroke-width="1.4" /><text x="665" y="380" fill="#315a85" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="25" font-weight="500">同一个团队房间</text><text x="665" y="418" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="21" font-weight="400">房间口令 / 成员权限</text><polyline points="665,444 936,444" fill="none" stroke="#d4dce5" stroke-width="1.8" /><text x="665" y="482" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="22" font-weight="400">共享消息与会话快照</text><text x="665" y="520" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="22" font-weight="400">成员在线状态</