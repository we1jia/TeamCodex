-family="Helvetica Neue, PingFang SC, sans-serif" font-size="19" font-weight="400">成员间通过 Hub 协作，不直接合并本地会话。</text><polyline points="800,736 800,775" fill="none" stroke="#909aab" stroke-width="1.8" marker-end="url(#gray)"/><rect x="580" y="782" width="460" height="129" rx="6" fill="#ffffff" stroke="#cbd2dc" stroke-width="1.4" /><text x="604" y="819" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="24" font-weight="500">Hub 持久化存储</text><text x="604" y="860" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="20" font-weight="400">消息 / 快照 / 工作区数据 / 上传文件</text><text x="604" y="890" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="19" font-weight="400">可部署在本机、团队局域网或私有云</text><rect x="1070" y="782" width="470" height="129" rx="6" fill="#eef2f6" stroke="none" stroke-width="1.4" /><text x="1094" y="819" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="24" font-weight="500">可选：Codex 插件入口</text><text x="1094" y="860" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="20" font-weight="400">Skills / Hook 读取 Hub 摘要</text><text x="1094" y="890" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="19" font-weight="400">把摘要带入当前任务，与侧栏入口分开</text><polyline points="60,953 1540,953" fill="none" stroke="#cbd2dc" stroke-width="1.8" /><text x="60" y="997" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="24" font-weight="500">示例 · A 分享，B 接力</text><text x="60" y="1041" fill="#263c55" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="23" font-weight="400">A 选择会话并分享   →   Hub 保存并通知同房间成员   →   B 在 Team 查看   →   B 选择并导入自己的会话</text><text x="60" y="1084" fill="#647184" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="19" font-weight="400">共享范围：已分享的内容；实时推送不等于自动导入每个成员的 AI 会话。</text></svg>