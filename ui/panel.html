<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TeamCodex</title>
  <style>
    :root {
      --bg: transparent;
      --card: rgba(0, 0, 0, 0.04);
      --line: rgba(0, 0, 0, 0.08);
      --text: #1d1d1f;
      --muted: #86868b;
      --ok: #34c759;
      --warn: #ff9f0a;
      --bad: #ff3b30;
      --accent: #0071e3;
      --fill: rgba(0, 0, 0, 0.05);
      --input-bg: rgba(255, 255, 255, 0.82);
      --dialog-bg: #f7f7f8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: transparent;
        --card: rgba(255, 255, 255, 0.06);
        --line: rgba(255, 255, 255, 0.10);
        --text: #f5f5f7;
        --muted: #8e8e93;
        --ok: #30d158;
        --warn: #ffd60a;
        --bad: #ff453a;
        --accent: #0a84ff;
        --fill: rgba(255, 255, 255, 0.08);
        --input-bg: rgba(0, 0, 0, 0.35);
        --dialog-bg: #242424;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent !important;
      color: var(--text);
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    body { width: 100%; min-width: 310px; }
    .sheet {
      margin: 0;
      padding: 16px 16px 14px;
      background: transparent !important;
      border-radius: 0;
      box-shadow: none;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .brand { font-weight: 620; letter-spacing: -0.02em; font-size: 14px; }
    .ver {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
    }
    .rows {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    .row {
      display: grid;
      grid-template-columns: 50px 12px 1fr;
      gap: 8px;
      align-items: center;
      padding: 9px 12px;
      min-height: 38px;
    }
    .row + .row { border-top: 1px solid var(--line); }
    .k { color: var(--muted); font-size: 12px; }
    .dot {
      width: 8px; height: 8px; border-radius: 99px;
      background: var(--bad);
    }
    .dot.ok { background: var(--ok); }
    .dot.wait { background: var(--warn); }
    .v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
    .actions { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
    button, .field button {
      appearance: none;
      border: 0;
      border-radius: 9px;
      min-height: 33px;
      padding: 0 12px;
      color: var(--text);
      background: var(--fill);
      font: inherit;
      font-size: 12.5px;
      cursor: pointer;
      transition: background 0.12s ease;
    }
    button:hover:not(:disabled), .field button:hover:not(:disabled) {
      background: rgba(0, 0, 0, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      button:hover:not(:disabled), .field button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.13);
      }
    }
    button.primary { background: var(--accent); color: white; font-weight: 600; }
    button.primary:hover:not(:disabled) { filter: brightness(1.05); }
    button.warn { background: var(--warn) !important; color: #1d1d1f !important; font-weight: 600; }
    button.warn:hover:not(:disabled) { filter: brightness(1.06); }
    button:disabled { opacity: 0.55; cursor: default; }
    .field {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
    }
    input {
      width: 100%;
      min-height: 33px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--input-bg);
      color: var(--text);
      padding: 0 10px;
      font: inherit;
      font-size: 12px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .update {
      display: none;
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(0, 113, 227, 0.12);
      color: var(--accent);
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .update.show { display: flex; }
    .msg { min-height: 16px; margin-top: 6px; color: var(--muted); font-size: 11.5px; }
  </style>
</head>
<body>
  <div class="sheet">
    <header>
      <div class="brand">TeamCodex</div>
      <div class="ver" id="ver"></div>
    </header>
    <div class="rows">
      <div class="row"><span class="k">Codex</span><span class="dot" id="codexDot"></span><span class="v" id="codexText">检测中</span></div>
      <div class="row"><span class="k">中枢</span><span class="dot" id="hubDot"></span><span class="v" id="hubText">检测中</span></div>
      <div class="row"><span class="k">房间</span><span class="dot ok"></span><span class="v" id="roomText">—</span></div>
    </div>
    <div class="actions">
      <button class="primary" id="startBtn" type="button">启动并挂载 Codex</button>
      <button id="tokenBtn" type="button">复制协同口令</button>
      <div class="field">
        <input id="hubInput" spellcheck="false" placeholder="http://192.168.1.8:18765" />
        <button id="hubBtn" type="button">保存</button>
      </div>
      <div class="field" style="grid-template-columns: 1fr 1fr;">
        <button id="restartBtn" type="button">重启注入</button>
        <button id="checkUpdateBtn" type="button">检查更新</button>
      </div>
    </div>
    <div class="update" id="updateBar">
      <span id="updateText">发现新版本</span>
      <button class="primary" id="updateBtn" type="button">立即更新</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    const api = (path, opt) => fetch(path, opt).then((r) => r.json());
    const $ = (id) => document.getElementById(id);
    function setDot(id, ok) {
      $(id).className = "dot " + (ok ? "ok" : "bad");
    }
    function say(text) { $("msg").textContent = text || ""; }

    async function refresh() {
      try {
        const s = await api("/api/status");
        $("ver").textContent = "v" + (s.app_version || "") + (s.build_id ? " · " + s.build_id : "");
        $("ver").title = '服务构建：' + (s.build_id || '旧版') + '；实际界面：' + (s.codex?.ui_version || '未验证');
        setDot("codexDot", s.codex?.injected || s.codex?.running);
        $("codexText").textContent = s.codex?.injected ? (s.codex?.pending_update ? "已挂载；新版界面在下次正常重开 Codex 后生效" : "已挂载（已验证）") : s.codex?.message || (s.codex?.running ? "已打开，等待挂载确认" : "未打开");
        $("codexDot").className = "dot " + (s.codex?.injected ? "ok" : s.codex?.running ? "wait" : "bad");
        $("hubDot").className = "dot " + (s.hub?.ok ? "ok" : "bad");
        $("hubText").textContent = s.hub?.ok ? (s.hub.lanUrl || s.hub.url) : "未连接";
        $("roomText").textContent = s.room?.id || "—";
        if (!$("hubInput").matches(":focus")) $("hubInput").value = s.hub?.url || "";
        const up = s.update;
        if (up?.has_update) {
          $("updateBar").classList.add("show");
          $("updateText").textContent = "发现 " + up.latest;
        } else {
          $("updateBar").classList.remove("show");
        }
      } catch (err) {
        say("控制面未就绪");
      }
    }

    let pendingLaunch = null;
    let confirmExpiry = null;
    const confirmation = document.createElement('div');
    confirmation.hidden = true;
    confirmation.setAttribute('role', 'alertdialog');
    confirmation.setAttribute('aria-label', '确认启动或重启 Codex');
    confirmation.style.cssText = 'position:fixed;inset:12px;z-index:30;padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--dialog-bg);overflow:auto;box-shadow:0 8px 40px #0003';
    confirmation.innerHTML = '<p id="launch-confirm-message"></p><button id="launch-confirm-accept" type="button">确认启动 / 重启</button> <button id="launch-confirm-cancel" type="button">取消</button>';
    $('msg').after(confirmation);
    $('launch-confirm-message').style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;margin-bottom:20px';
    const cancelLaunch = () => {
      pendingLaunch = null;
      clearTimeout(confirmExpiry);
      confirmation.hidden = true;
      $('startBtn').disabled = false;
    };
    $('launch-confirm-cancel').onclick = () => { cancelLaunch(); say('已取消，不会重启或挂载'); };
    window.addEventListener('pagehide', cancelLaunch);
    $('startBtn').onclick = async () => {
      cancelLaunch();
      $('startBtn').disabled = true;
      try {
        const response = await api('/api/start-codex', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        say(response.message || '检查完成');
        if (response.requires_restart_confirm && response.confirmToken) {
          pendingLaunch = response.confirmToken;
          $('launch-confirm-message').textContent = response.message;
          confirmation.hidden = false;
          confirmExpiry = setTimeout(() => { cancelLaunch(); say('确认已过期，请重新检查状态'); }, 60000);
        }
      } catch (error) { say('检查失败：' + error.message); }
      finally { if (!pendingLaunch) $('startBtn').disabled = false; }
    };
    $('launch-confirm-accept').onclick = async () => {
      if (!pendingLaunch) return;
      const confirmToken = pendingLaunch;
      cancelLaunch();
      $('startBtn').disabled = true;
      say('正在处理已确认的目标实例，请等待...');
      try {
        const response = await api('/api/start-codex', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ confirmToken }) });
        say(response.message || '已提交操作，等待实际挂载结果');
      } catch (error) { say('操作失败：' + error.message); }
      finally { $('startBtn').disabled = false; refresh(); }
    };
    $("restartBtn").onclick = async () => {
      const result = await api("/api/restart-inject", { method: "POST", headers: { 'Content-Type': 'application/json' }, body: '{}' });
      say(result.message || "已启动观察器，等待实际挂载结果");
      refresh();
    };
    $("checkUpdateBtn").onclick = async () => {
      $("checkUpdateBtn").disabled = true;
      say("正在连接 GitHub 检查更新...");
      try {
        const s = await api("/api/update?force=1");
        if (s.has_update) {
          $("updateBar").classList.add("show");
          $("updateText").textContent = "发现新版本 v" + s.latest;
          say("发现新版本 v" + s.latest + "，可点击下方立即更新");
        } else if (s.check_failed) {
          say(s.message || "检查更新超时，请稍后重试");
        } else {
          $("updateBar").classList.remove("show");
          say("当前已是最新版本 (v" + s.current + ")");
        }
      } catch {
        say("检查更新超时，请稍后重试");
      } finally {
        $("checkUpdateBtn").disabled = false;
      }
    };
    $("tokenBtn").onclick = async () => {
      const data = await api("/api/token");
      try {
        await navigator.clipboard.writeText(data.token);
        say("口令已复制");
      } catch {
        say(data.token);
      }
    };
    $("hubBtn").onclick = async () => {
      const hub_url = $("hubInput").value.trim();
      const data = await api("/api/hub", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ hub_url }),
      });
      say(data.ok ? "中枢已切换" : (data.message || "切换失败"));
      refresh();
    };
    $("updateBtn").onclick = async () => {
      $("updateBtn").disabled = true;
      say("正在下载更新");
      const data = await api("/api/update/download", { method: "POST" });
      say(data.ok ? (data.dest ? "已打开安装包" : "已是最新") : (data.error || "请打开 GitHub Releases"));
      if (!data.ok && data.url) location.href = data.url;
      $("updateBtn").disabled = false;
    };
    refresh();
    setInterval(refresh, 2500);
  </script>
</body>
</html>
