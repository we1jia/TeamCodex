name: Release & Package Matrix

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package Windows and Plugin ZIPs for regression tests
        run: |
          python3 windows/build_zip.py
          python3 scripts/build_plugin_zip.py

      - name: Run automated tests
        run: |
          node --test tests/test_boost_fixes.mjs
          node --test tests/test_rooms_and_auth.mjs

      - name: Build macOS Portable Bundle (ZIP)
        run: python3 macos/build_mac_zip.py

      - name: Build macOS Native Installer (DMG)
        run: python3 macos/build_dmg.py

      - name: Build Codex Plugin Bundle (ZIP)
        run: python3 scripts/build_plugin_zip.py

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            TeamCodex-macOS.dmg
            TeamCodex-macOS.zip
            TeamCodex-Codex-Plugin.zip

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install NSIS compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Build Windows Portable Bundle (ZIP)
        run: python3 windows/build_zip.py

      - name: Build Windows Executable Installer (Setup.exe)
        run: |
          cd windows
          makensis installer.nsi

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            TeamCodex-Setup.exe
            TeamCodex-Windows-arm64-amd64.zip

  publish-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: .

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: .

      - name: Generate SHA256 checksums
        run: |
          sha256sum TeamCodex-macOS.dmg TeamCodex-Setup.exe TeamCodex-macOS.zip TeamCodex-Windows-arm64-amd64.zip TeamCodex-Codex-Plugin.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: TeamCodex ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            TeamCodex-macOS.dmg
            TeamCodex-Setup.exe
            TeamCodex-macOS.zip
            TeamCodex-Windows-arm64-amd64.zip
            TeamCodex-Codex-Plugin.zip
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
