name: Release & Package Matrix

on:
  workflow_call:
    inputs:
      version_tag:
        required: true
        type: string
      release_ref:
        required: true
        type: string
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag (leave blank to use version.json)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}
          fetch-depth: 0
      - name: Validate release version and target commit
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.version_tag }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          version = json.loads(Path('version.json').read_text())['version']
          expected = f'v{version}'
          tag = os.environ['INPUT_TAG'] or (os.environ['REF_NAME'] if os.environ['EVENT_NAME'] == 'push' else expected)
          subprocess.run(['python3', 'scripts/release_version.py', tag], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY

  build-macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package Windows and Plugin ZIPs for regression tests
        run: |
          python3 windows/build_zip.py
          python3 scripts/build_plugin_zip.py

      - name: Build native context reader for regression tests
        run: |
          swiftc -O macos/TeamCodex.swift -o "$RUNNER_TEMP/TeamCodex-context-reader" -framework Cocoa -framework WebKit
          echo "TEAM_CODEX_CONTEXT_READER=$RUNNER_TEMP/TeamCodex-context-reader" >> "$GITHUB_ENV"

      - name: Run automated tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*packaging.py'
          node --test tests/test_image_upload.mjs
          node --test tests/test_workspace.mjs tests/test_workspace_bridge.mjs tests/test_workspace_http.mjs
          node --test tests/test_safety.mjs tests/test_runtime_policy.mjs tests/test_runtime_integration.mjs tests/test_runtime_adapters.mjs tests/test_mount_recovery.mjs
          node --test tests/test_workspace_typography.mjs tests/test_host_layout.mjs tests/test_workspace_dialog.mjs
          node --test tests/test_team_navigation.mjs
          node --test tests/test_attach_shutdown.mjs
          node --test tests/test_launch_recovery.mjs
          node --test tests/test_room_rpc.mjs
          node --test tests/test_composer_appearance.mjs
          node --test tests/test_launcher_lifecycle.mjs
          node --test tests/test_discussion_appearance.mjs
          node --test tests/test_boost_fixes.mjs
          node --test tests/test_rooms_and_auth.mjs

      - name: Build macOS Portable Bundle (ZIP)
        run: python3 macos/build_mac_zip.py

      - name: Build macOS Native Installer (DMG)
        run: python3 macos/build_dmg.py

      - name: Build Codex Plugin Bundle (ZIP)
        run: python3 scripts/build_plugin_zip.py

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            TeamCodex-macOS.dmg
            TeamCodex-macOS.zip
            TeamCodex-Codex-Plugin.zip

  build-windows:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install NSIS compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Build Windows Portable Bundle (ZIP)
        run: python3 windows/build_zip.py

      - name: Verify Windows release packaging
        run: python3 -m unittest discover -s tests -p 'test_windows_release_packaging.py'

      - name: Build Windows Executable Installer (Setup.exe)
        run: |
          cd windows
          makensis installer.nsi

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            TeamCodex-Setup.exe
            TeamCodex-Windows-arm64-amd64.zip

  publish-release:
    needs: [prepare, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: .

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: .

      - name: Generate SHA256 checksums
        run: |
          sha256sum TeamCodex-macOS.dmg TeamCodex-Setup.exe TeamCodex-macOS.zip TeamCodex-Windows-arm64-amd64.zip TeamCodex-Codex-Plugin.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Select release notes
        id: notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          if [ -f "$notes" ]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: TeamCodex ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ inputs.release_ref || github.sha }}
          draft: false
          prerelease: false
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            TeamCodex-macOS.dmg
            TeamCodex-Setup.exe
            TeamCodex-macOS.zip
            TeamCodex-Windows-arm64-amd64.zip
            TeamCodex-Codex-Plugin.zip
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
